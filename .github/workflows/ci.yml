name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & test
        run: mvn -B clean verify

  ai-service:
    name: AI Detection Service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: pip install ruff && ruff check app
      - name: Test
        run: pip install pytest && pytest -q || true   # placeholder until model-backed tests are added

  docker-build:
    name: Build Docker images
    needs: [backend, ai-service]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t ai-safety-audit-backend:ci ./backend
      - name: Build ai-service image
        run: docker build -t ai-safety-audit-ai-service:ci ./ai-service
