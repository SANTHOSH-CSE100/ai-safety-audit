events {}

http {
    upstream backend {
        server backend:8080;
    }

    server {
        listen 80;

        client_max_body_size 500M;  # allow large video uploads

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /swagger-ui/ {
            proxy_pass http://backend;
        }

        location / {
            return 404;
        }
    }
}
