apiVersion: apps/v1
kind: Deployment
metadata:
  name: asa-backend
spec:
  replicas: 2
  selector:
    matchLabels: { app: asa-backend }
  template:
    metadata:
      labels: { app: asa-backend }
    spec:
      containers:
        - name: backend
          image: ai-safety-audit-backend:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: asa-backend-config }
            - secretRef: { name: asa-backend-secrets }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: asa-backend
spec:
  selector: { app: asa-backend }
  ports:
    - port: 8080
      targetPort: 8080
